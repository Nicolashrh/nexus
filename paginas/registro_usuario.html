<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Registro_Usuario</title>
        <link rel="stylesheet" href="../estilos/stails.css" />
    </head>
    <body>
        <header class="barra">
            <div class="logo-con">
                <a href="../index.html">
                    <img
                        src="../imagenes/485fd336a1eb9e94a72ed950af6c1793.webp"
                        alt="Logo de la empresa"
                        class="logo-img"
                    />
                </a>
            </div>
            <nav class="link-nav"></nav>
            <div class="usuario"></div>
        </header>

        <main class="login-con">
            <section class="login-tarjeta">
                <h2>Registro de Usuario</h2>

                <form
                    class="login-form"
                    id="formularioRegistro"
                    onsubmit="
                        registrarUsuario();
                        return false;
                    "
                >
                    <div class="campo-grupo">
                        <label for="usuario-registro">Usuario</label>
                        <input
                            type="text"
                            id="usuario-registro"
                            placeholder="Crea tu usuario"
                            required
                        />
                    </div>

                    <div class="campo-grupo">
                        <label for="correo-registro">Correo electronico</label>
                        <input
                            type="email"
                            id="correo-registro"
                            placeholder="Ingresa tu correo electronico"
                            required
                        />
                    </div>

                    <div class="campo-grupo">
                        <label for="contraseña-registro">Contraseña</label>
                        <input
                            type="password"
                            id="contraseña-registro"
                            placeholder="Crea tu contraseña"
                            required
                        />
                    </div>

                    <button type="submit" class="boton-ingreso">
                        Registrarse
                    </button>
                </form>

                <div class="registro-link">
                    <p>
                        ¿Ya tienes cuenta en Nexus?
                        <a href="inicio_sesion.html">Inicia sesión aqui</a>
                    </p>
                </div>
            </section>
        </main>

        <script src="../scripts/scripts.js"></script>

        <footer>
            <div class="footer-con">
                <p>
                    Todos los derechos reservados pertenecen a Nexus.com y
                    Nexus.cl
                </p>
                <div class="footer-links">
                    <a href="nosotros.html">Nosotros</a>
                </div>
            </div>
        </footer>
    </body>
</html>
